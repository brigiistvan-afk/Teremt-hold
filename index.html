<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teremtő Hold</title>
<meta name="description" content="Manifesztációs vezető app – a csendből a szándékon át a lépésig, a hold ritmusában.">
<meta name="theme-color" content="#07161c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teremtő Hold">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#140b24;--bg2:#1d1133;--card:#24163c;--card2:#2e1c4b;--card3:#382359;
  --gold:#d9b25f;--gold2:#f3d58c;--gold3:#a8843a;
  --text:#f4eeff;--muted:#bba9d8;--faint:#8b78ad;
  --line:rgba(217,178,95,.22);--line2:rgba(187,169,216,.18);
  --ok:#9fd8a9;--warn:#f0c27a;--r:20px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.fs-l{font-size:20px} html.fs-xl{font-size:22px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Mulish',system-ui,-apple-system,sans-serif;line-height:1.55;
  background:radial-gradient(1200px 600px at 80% -10%,#3a1f62 0%,transparent 60%),radial-gradient(900px 500px at -10% 30%,#2a1548 0%,transparent 55%),var(--bg);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--gold2);margin:0 0 .4rem;line-height:1.15}
h1{font-size:2.1rem} h2{font-size:1.65rem} h3{font-size:1.3rem}
p{margin:.3rem 0 .8rem}
small,.small{font-size:.85rem;color:var(--muted)}
.muted{color:var(--muted)}
.gold{color:var(--gold2)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:14px;padding:.75rem .9rem;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;margin:.9rem 0 .35rem}
::placeholder{color:var(--faint)}

/* layout */
#app{display:none;max-width:640px;margin:0 auto;padding:calc(var(--safe-t) + .6rem) 1rem calc(6.2rem + var(--safe-b))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.4rem 0 .8rem}
.brand{display:flex;align-items:center;gap:.55rem}
.brand b{font-family:'Cormorant Garamond',serif;font-size:1.45rem;color:var(--gold2);font-weight:700;letter-spacing:.3px}
.icon-btn{background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:14px;width:46px;height:46px;display:grid;place-items:center}
.icon-btn svg{width:24px;height:24px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,11,36,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:.4rem .3rem calc(.4rem + var(--safe-b))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.35rem 0;color:var(--faint);font-size:.74rem;font-weight:600}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--gold2)}

.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:var(--r);padding:1.1rem 1.1rem;margin:0 0 1rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card.gold{border-color:var(--line);background:linear-gradient(160deg,#3a2560,#24163c)}
.card h3{margin-bottom:.3rem}
.row{display:flex;align-items:center;gap:.7rem}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:16px;padding:.85rem 1.2rem;font-weight:700;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));color:#2a1640;box-shadow:0 6px 18px rgba(217,178,95,.25);min-height:52px}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.soft{background:rgba(217,178,95,.14);color:var(--gold2);border:1px solid var(--line);box-shadow:none}
.btn.sm{min-height:42px;padding:.5rem .9rem;font-size:.92rem;border-radius:13px}
.btn:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .7rem;border-radius:999px;background:rgba(217,178,95,.14);border:1px solid var(--line);color:var(--gold2);font-size:.82rem;font-weight:700}
.pill.muted{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:999px;padding:.55rem .95rem;font-weight:600;font-size:.95rem}
.chip.on{background:rgba(217,178,95,.18);border-color:var(--gold);color:var(--gold2)}

/* moon hero */
.hero{display:flex;gap:1rem;align-items:center}
.hero .moon{flex:0 0 auto}
.hero .txt{flex:1}
.hero .phase{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--gold2);font-weight:700;line-height:1.1}

/* steps */
.steps{display:flex;flex-direction:column;gap:.7rem}
.step{display:flex;gap:.85rem;align-items:flex-start;padding:.95rem;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line2)}
.step.done{border-color:rgba(159,216,169,.45);background:rgba(159,216,169,.07)}
.step .n{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:rgba(217,178,95,.15);color:var(--gold2);border:1px solid var(--line)}
.step.done .n{background:rgba(159,216,169,.2);color:var(--ok);border-color:rgba(159,216,169,.5)}
.step .b{flex:1;min-width:0}
.step .t{font-weight:700;font-size:1.05rem}
.step .d{color:var(--muted);font-size:.92rem;margin:.1rem 0 .55rem}
.check{display:flex;align-items:center;gap:.6rem;font-weight:600;cursor:pointer;margin:.3rem 0}
.check input{width:26px;height:26px;accent-color:var(--gold)}

.mood{display:flex;justify-content:space-between;gap:.35rem}
.mood button{flex:1;border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:14px;padding:.5rem 0;font-size:1.5rem}
.mood button.on{border-color:var(--gold);background:rgba(217,178,95,.18)}

.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.stat div{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:16px;padding:.8rem;text-align:center}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold2);line-height:1}

.list-item{padding:.85rem 0;border-top:1px solid var(--line2)}
.list-item:first-child{border-top:0}
.tool{display:flex;gap:.85rem;align-items:center;text-align:left;width:100%;background:rgba(255,255,255,.035);border:1px solid var(--line2);border-radius:18px;padding:.9rem;margin-bottom:.65rem}
.tool .ic{flex:0 0 50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(217,178,95,.13);border:1px solid var(--line);font-size:1.5rem}
.tool .t{font-weight:700}
.tool .d{font-size:.88rem;color:var(--muted)}
.sec-title{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:1.3rem 0 .6rem}
.quote{font-family:'Cormorant Garamond',serif;font-size:1.35rem;line-height:1.35;color:var(--text);font-style:italic}
.note{border-left:3px solid var(--gold);padding:.4rem .8rem;background:rgba(217,178,95,.07);border-radius:0 12px 12px 0;font-size:.92rem;color:var(--muted);margin:.6rem 0}
.warn{border-left-color:var(--warn);color:#f6dfb8}
.neg{margin-top:.45rem;font-size:.9rem;color:#f6dfb8;background:rgba(240,194,122,.1);border:1px solid rgba(240,194,122,.35);border-radius:12px;padding:.55rem .75rem;display:none}
.neg.show{display:block}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));border-radius:99px;transition:width .4s}
.dots{display:flex;gap:.4rem;flex-wrap:wrap}
.dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold);display:inline-block}
.dots span.on{background:var(--gold)}
.empty{text-align:center;padding:1.4rem .6rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,5,20,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet.open{display:block}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;top:calc(var(--safe-t) + 1.2rem);max-width:640px;margin:0 auto;background:linear-gradient(180deg,#2a1a47,#1a0f2e 40%);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.1rem .6rem;border-bottom:1px solid var(--line2)}
.sheet .head h2{margin:0;font-size:1.5rem}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1.1rem calc(2rem + var(--safe-b));flex:1}

/* ===== LÁGY FELÜLET ===== */
:root{--r:26px;--soft:linear-gradient(165deg,rgba(66,41,106,.72),rgba(34,20,58,.9));--glow:0 14px 34px rgba(8,3,20,.38),inset 0 1px 0 rgba(255,255,255,.05)}
.card{border:0;background:var(--soft);box-shadow:var(--glow);border-radius:28px;padding:1.2rem}
.card.gold{background:radial-gradient(120% 90% at 85% 0%,rgba(243,213,140,.17),transparent 60%),linear-gradient(165deg,#43296f,#251640);border:0}
.btn{border-radius:999px;min-height:54px;padding:.85rem 1.4rem}
.btn.sm{border-radius:999px;min-height:46px;padding:.55rem 1.05rem}
.btn.ghost{background:rgba(255,255,255,.07);border:0}
.btn.soft{background:rgba(217,178,95,.15);border:0}
input,textarea,select{border-radius:18px;border:1.5px solid transparent;background:rgba(255,255,255,.08);padding:.9rem 1rem;font-size:1rem;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus,select:focus{border-color:rgba(243,213,140,.6);background:rgba(255,255,255,.11);box-shadow:0 0 0 4px rgba(217,178,95,.12)}
button,.chip,.act{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.pill{border:0;background:rgba(217,178,95,.16)}
.pill.muted{border:0;background:rgba(255,255,255,.07)}
.chip{border:0;background:rgba(255,255,255,.08);padding:.7rem 1.1rem;min-height:46px;font-size:1rem;transition:background .2s}
.chip.on{background:rgba(217,178,95,.25);color:var(--gold2);box-shadow:inset 0 0 0 1.5px rgba(243,213,140,.55)}
.chip.on::before{content:'✓ ';font-weight:800}
.mood button{border:0;background:rgba(255,255,255,.07);border-radius:50%;aspect-ratio:1/1;padding:0;font-size:1.65rem}
.mood button.on{background:rgba(217,178,95,.25);box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(243,213,140,.35)}
.note{border-left:0;border-radius:18px;background:rgba(217,178,95,.09);padding:.75rem 1rem}
.step{border:0;background:rgba(255,255,255,.05);border-radius:22px}
.stat div{border:0;background:var(--soft);border-radius:22px;box-shadow:var(--glow)}
.tool{border:0;background:rgba(255,255,255,.06);border-radius:22px}
.tool .ic{border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(243,213,140,.25),rgba(217,178,95,.07))}
.route{border:0;background:rgba(255,255,255,.07);border-radius:24px}
.route.on{background:rgba(217,178,95,.22);box-shadow:inset 0 0 0 1.5px rgba(243,213,140,.55)}
.icon-btn{border:0;border-radius:50%;background:rgba(255,255,255,.08)}
nav.tabs{border-top:0;box-shadow:0 -10px 30px rgba(8,3,20,.45);border-radius:26px 26px 0 0}

/* buborék-ikon */
.dot{flex:0 0 50px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:radial-gradient(circle at 35% 30%,rgba(243,213,140,.25),rgba(217,178,95,.06));box-shadow:0 0 0 1px rgba(217,178,95,.22),0 6px 16px rgba(0,0,0,.25)}
.dot.big{flex-basis:62px;width:62px;height:62px;font-size:1.8rem}
.pb{display:flex;flex-direction:column;gap:.12rem;flex:1;min-width:0}
.pt{font-weight:700;font-size:1.06rem;line-height:1.25}
.ps{font-size:.86rem;color:var(--muted);line-height:1.35}
.chev{color:var(--faint);font-size:1.6rem;line-height:1}

/* kiemelt feladat */
.feature{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;border:0;border-radius:28px;padding:1.1rem;background:radial-gradient(130% 100% at 0% 0%,rgba(243,213,140,.2),transparent 55%),linear-gradient(150deg,#4f2f80,#2b1a48);box-shadow:var(--glow);margin-bottom:.4rem}

/* napi ösvény */
.path{padding:.6rem 1rem}
.prow{display:flex;align-items:center;gap:.95rem;width:100%;background:none;border:0;text-align:left;padding:.6rem 0;position:relative;border-radius:18px}
.path .prow:not(:last-child)::before{content:'';position:absolute;left:24px;top:62px;height:calc(100% - 50px);width:2px;background:linear-gradient(rgba(217,178,95,.4),rgba(217,178,95,.08));border-radius:2px}
.prow .dot{position:relative;z-index:1}
.prow.done .dot{background:radial-gradient(circle at 35% 30%,#fbe9b8,#d9b25f);color:#2a1640;font-weight:800;box-shadow:0 0 18px rgba(243,213,140,.45)}
.prow.done .pt{color:var(--gold2)}

/* lágy listák */
.list{background:var(--soft);box-shadow:var(--glow);border-radius:26px;padding:.3rem 1rem;margin-bottom:1rem}
.lrow{display:flex;align-items:center;gap:.9rem;width:100%;background:none;border:0;text-align:left;padding:.8rem 0;border-top:1px solid rgba(187,169,216,.09)}
.lrow:first-child{border-top:0}
.lrow .dot{flex-basis:44px;width:44px;height:44px;font-size:1.25rem}
.prow:active,.lrow:active,.feature:active,.act:active,.chip:active,.tile:active{opacity:.8}

/* puha akció-gombok */
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.act{display:inline-flex;align-items:center;gap:.35rem;border:0;border-radius:999px;padding:.6rem 1rem;min-height:44px;background:rgba(255,255,255,.08);font-weight:600;font-size:.95rem}

/* megmaradt csempék lágyítva (lapokon belül) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.tiles.t2s{gap:.5rem}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.4rem;width:100%;min-height:92px;padding:.95rem 1rem;border:0;border-radius:24px;text-align:left;background:rgba(255,255,255,.07)}
.tile .ti{font-size:1.7rem;line-height:1}
.tile .tb{display:flex;flex-direction:column}
.tile .tt{font-weight:700;font-size:1rem}
.tile.mini{min-height:58px;flex-direction:row;align-items:center;justify-content:center;gap:.45rem;padding:.5rem;border-radius:999px}
.tile.mini .ti{font-size:1.3rem}
.tile.pick{background:rgba(217,178,95,.25);box-shadow:inset 0 0 0 1.5px rgba(243,213,140,.6);color:var(--gold2)}

/* naptár: kerek napok */
.cal{display:grid;gap:.5rem}
.cal.c6{grid-template-columns:repeat(6,1fr)}.cal.c7{grid-template-columns:repeat(7,1fr)}
.cell{aspect-ratio:1/1;border-radius:50%;border:0;background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;position:relative;line-height:1.05}
.cell b{font-size:.8rem}.cell span{font-size:.85rem}
.cell.past{opacity:.5}
.cell.ok{opacity:1;background:rgba(159,216,169,.16)}
.cell.ok::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.cell.now{background:rgba(217,178,95,.28);box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(243,213,140,.4);opacity:1}

/* 0–10 skála */
.scale-w{margin:.3rem 0 .4rem}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.scale button{height:46px;border:0;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;font-size:1rem;color:var(--muted)}
.scale button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1640;box-shadow:0 4px 14px rgba(217,178,95,.35)}
.scale-l{display:flex;justify-content:space-between;font-size:.8rem;color:var(--faint);margin-top:.35rem}
.mb{display:flex;flex-direction:column;align-items:center;padding:.6rem 0}
.mb b{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--gold2)}.mb span{font-size:2.4rem;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:99px;background:rgba(255,255,255,.12);padding:0;border:0;margin:.8rem 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--gold2);box-shadow:0 2px 10px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--gold2);border:0}
.sheet .panel{bottom:var(--kb,0px);transition:bottom .2s;border:0;border-radius:30px 30px 0 0}
.sheet .head{border-bottom:0}

/* breath */
.breath-wrap{display:grid;place-items:center;padding:1.2rem 0}
.breath{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;position:relative}
.breath .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(243,213,140,.55),rgba(217,178,95,.15) 60%,transparent 72%);transform:scale(.55);transition:transform 5s ease-in-out}
.breath.in .ring{transform:scale(1)}
.breath .lbl{position:relative;font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:var(--gold2);font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-size:1.1rem;color:var(--muted);text-align:center}

.narr{min-height:150px;display:grid;place-items:center;text-align:center;padding:1rem .4rem}
.narr p{font-family:'Cormorant Garamond',serif;font-size:1.45rem;line-height:1.4;color:var(--text)}

/* lock */
#lock{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:1.4rem;background:radial-gradient(700px 500px at 50% 0%,#40236b,transparent 70%),var(--bg)}
#lock .box{width:100%;max-width:420px;text-align:center}
#lock .box .card{text-align:left}
.err{color:#ffb4a8;font-size:.92rem;min-height:1.3em;margin-top:.5rem}

/* onboarding */
.ob{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 1.4rem) 1.1rem 2rem}
.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.route{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:18px;padding:1rem .8rem;text-align:left}
.route .e{font-size:1.8rem}
.route .n{font-weight:700;margin-top:.25rem}
.route .s{font-size:.82rem;color:var(--muted)}
.route.on{border-color:var(--gold);background:rgba(217,178,95,.14)}

.vb{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.vb .it{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:rgba(255,255,255,.04);min-height:120px;display:flex;align-items:flex-end}
.vb .it img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vb .it .cap{position:relative;width:100%;padding:.5rem .6rem;background:linear-gradient(transparent,rgba(10,5,20,.85));font-size:.88rem;font-weight:600}
.vb .it .k{position:absolute;top:.4rem;left:.4rem;z-index:2}
.vb .it .x{position:absolute;top:.35rem;right:.35rem;z-index:2;background:rgba(0,0,0,.5);border:0;border-radius:50%;width:30px;height:30px;color:#fff}

#bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,14,22,.55) 0%,rgba(5,14,22,.35) 30%,rgba(5,14,22,.55) 65%,rgba(5,12,18,.82) 100%)}
:root{--soft:linear-gradient(165deg,rgba(14,34,44,.62),rgba(8,20,30,.72));--glow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.card,.list,.stat div{background:var(--soft);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card.gold{background:radial-gradient(120% 90% at 85% 0%,rgba(243,213,140,.18),transparent 60%),linear-gradient(165deg,rgba(20,48,58,.7),rgba(8,22,32,.8));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.feature{background:radial-gradient(130% 100% at 0% 0%,rgba(243,213,140,.22),transparent 55%),linear-gradient(150deg,rgba(22,56,66,.75),rgba(8,24,34,.82));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav.tabs{background:rgba(6,18,26,.82)}
.sheet .panel{background:linear-gradient(180deg,rgba(14,38,48,.97),rgba(6,18,26,.98) 45%)}
#lock{background:transparent}
#lock .box .card{background:rgba(8,22,32,.72)}
.sec-title,#view>h2,#view>p.muted,header.top b,#view>.row .sec-title{text-shadow:0 1px 8px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
.sec-title{color:#d7cbe9}

/* ===== v1.4 javítások ===== */
h1,h2,h3,.phase,.quote,.narr p,.mb b,.stat b,.breath .lbl,#shTitle{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
select{-webkit-appearance:none;appearance:none;background-color:rgba(255,255,255,.08);background-image:linear-gradient(45deg,transparent 50%,#f3d58c 50%),linear-gradient(135deg,#f3d58c 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:2.4rem}
select option{color:#10232b;background:#f4f1ea}
input[type=checkbox]{accent-color:var(--gold);width:26px;height:26px}
textarea.auto{min-height:58px;overflow:hidden;resize:none;line-height:1.45}
.daily{padding:1rem 1.1rem}
.daily .quote{font-size:1.4rem}
.act.on{background:rgba(217,178,95,.25);color:var(--gold2)}
.hscroll{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 .8rem;margin:0 -1.1rem;padding-left:1.1rem;padding-right:1.1rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:0 0 auto;white-space:nowrap}
.chip.sm{min-height:38px;padding:.4rem .8rem;font-size:.88rem}
.aff{display:flex;align-items:center;gap:.4rem;padding:.35rem .3rem;border-radius:18px;transition:background .25s}
.aff + .aff{border-top:1px solid rgba(187,169,216,.08)}
.aff-t{flex:1;text-align:left;background:none;border:0;padding:.65rem .5rem;font-size:1.08rem;line-height:1.4;color:var(--text);font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.3rem}
.aff-b{flex:0 0 44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.06);font-size:1.2rem;color:var(--muted)}
.aff-b.on{color:#f5a3b5;background:rgba(245,163,181,.14)}
.aff.playing{background:rgba(217,178,95,.16);box-shadow:inset 0 0 0 1.5px rgba(243,213,140,.45)}
#afList{background:var(--soft);border-radius:24px;padding:.4rem .5rem;box-shadow:var(--glow);margin-bottom:1rem}
.prompter{text-align:center}
.prompter .quote{font-size:1.6rem;min-height:4.2em;display:grid;place-items:center;margin:.5rem 0 .8rem}
.recbtn{width:92px;height:92px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffd6c9,#e2735a);box-shadow:0 0 0 6px rgba(226,115,90,.18),0 10px 26px rgba(0,0,0,.4);display:grid;place-items:center}
.recbtn span{width:30px;height:30px;border-radius:50%;background:#fff;transition:.2s}
.recbtn.on{animation:pulse 1.4s infinite}
.recbtn.on span{border-radius:7px;background:#7a1f12}
.recbtn:disabled{opacity:.4}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(226,115,90,.25),0 10px 26px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 18px rgba(226,115,90,.08),0 10px 26px rgba(0,0,0,.4)}}
.btn:disabled{opacity:.35}
#toast{background:rgba(16,44,52,.96);border:0;box-shadow:0 10px 30px rgba(0,0,0,.45)}
</style>
</head>

const SYN = 29.530588853;
function moon(date=new Date()){
  const jd = date.getTime()/86400000 + 2440587.5;
  let age = ((jd - 2451550.1) / SYN) % 1; if(age<0) age+=1; age *= SYN;
  const illum = (1 - Math.cos(2*Math.PI*age/SYN))/2;
  let key, name;
  if(age < 1.85){key='uj';name='Újhold';}
  else if(age < 5.54){key='novsarlo';name='Növő sarló';}
  else if(age < 9.23){key='elsonegyed';name='Első negyed';}
  else if(age < 12.92){key='novdom';name='Növő hold';}
  else if(age < 16.61){key='teli';name='Telihold';}
  else if(age < 20.30){key='fogydom';name='Fogyó hold';}
  else if(age < 23.99){key='utolsonegyed';name='Utolsó negyed';}
  else if(age < 27.68){key='fogysarlo';name='Fogyó sarló';}
  else {key='uj';name='Újhold';}
  return {age, illum, key, name, dayIdx: Math.min(29, Math.floor(age))};
}

function moonPath(age, size){
  const r = size/2 - 2, c = size/2, p = age/SYN;
  const k = Math.cos(2*Math.PI*p) * r, waxing = p < .5;
  const sweepOuter = waxing ? 1 : 0, ex = Math.abs(k);

}

}

const TTS = {
  synth: window.speechSynthesis || null, voice:null, timer:null, cancelled:false,
  init(){ if(!this.synth) return; const pick = () => { const vs = this.synth.getVoices(); this.voice = vs.find(v => /hu/i.test(v.lang) && /google|natural|premium|enhanced/i.test(v.name)) || vs.find(v => /hu/i.test(v.lang)) || null; }; pick(); this.synth.onvoiceschanged = pick; },
  has(){ return !!(this.synth && S.settings.voice); },
  stop(){ this.cancelled = true; clearTimeout(this.timer); if(this.synth) this.synth.cancel(); },
  run(segs, onStep, onEnd){
    this.stop(); this.cancelled = false; let i = 0;
    const next = () => {
      if(this.cancelled) return;
      if(i >= segs.length){ onEnd && onEnd(); return; }
      const s = segs[i]; onStep && onStep(i, s);
      const after = () => { if(this.cancelled) return; this.timer = setTimeout(() => { i++; next(); }, (s.p||2)*1000); };
      if(this.has()){
        const u = new SpeechSynthesisUtterance(s.t); u.lang = 'hu-HU'; if(this.voice) u.voice = this.voice; u.rate = S.settings.rate || .9; u.pitch = 1;
        u.onend = after; u.onerror = after; this.synth.speak(u);
      } else { this.timer = setTimeout(after, Math.max(2500, s.t.length * 65)); }
    };
    next();
  }
};
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function chime(){
  const a = ac(); if(!a) return; const t = a.currentTime;
  [528, 792, 1056].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18/(i+1), t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+3.2); o.connect(g).connect(a.destination); o.start(t); o.stop(t+3.3); });
}
const DRONE = { nodes:null,
  start(){ if(!S.settings.sound || this.nodes) return; const a = ac(); if(!a) return; const g = a.createGain(); g.gain.value = 0; const lp = a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600; const os = [110, 164.81, 220.5].map((f,i) => { const o = a.createOscillator(); o.type = i===2?'triangle':'sine'; o.frequency.value=f; o.connect(lp); o.start(); return o; }); lp.connect(g).connect(a.destination); g.gain.linearRampToValueAtTime(0.045, a.currentTime+3); this.nodes={g,os}; },
  stop(){ if(!this.nodes||!AC) return; const {g,os} = this.nodes; g.gain.linearRampToValueAtTime(0, AC.currentTime+1.5); setTimeout(()=>os.forEach(o=>{try{o.stop()}catch(e){}}),1700); this.nodes=null; }
};

function active(key){ const d = S.days[key]; return !!(d && (Object.values(d.steps||{}).some(Boolean) || (d.hala||[]).length)); }
function streak(){
  let key = dKey(), n = 0, gap = 0;
  if(!active(key)) key = addDays(key, -1);
  for(let i=0;i<400;i++){
    if(active(key)){ n++; gap = 0; }
    else { gap++; if(gap >= 2) break; }
    key = addDays(key, -1);
  }
  return n;
}

    case 'questions': case 'quick': return openQuestions();

    case 'dailyFav': { const t=dailyAff().t, f=affFavs(); if(!f.includes(t)){ f.push(t); save(); toast('Kedvencekhez adva ♥'); } return render(); }
    case 'sos': return openSOS();

    case 'm369': return open369();
    case 'm55': return open55();

    case 'vision': return openVision();
    case 'gratitude': return openGratitude();
    case 'revision': return openRevision();
    case 'share': return openShare();
    case 'imenu': return openIntentMenu(id);
    case 'task': return openTask(ds.w ? WEEK_PROG[+ds.i] : MOON_PROG[+ds.i], ds.w ? `Első hét · ${+ds.i+1}. nap` : `Holdciklus · ${+ds.i+1}. nap`);
    case 'today': closeSheetQuiet(); return go('ma');
    case 'tuned': mark('szandek'); toast('Ráhangolódtál. Vidd magaddal ezt az érzést.'); return closeSheet();
    case 'setMain': S.mainId = id; save(); toast('Ez lett a fő szándékod.'); return closeSheet();
    case 'achieve': { const it = S.intentions.find(i=>i.id===id); if(!it) return; it.status='valosag'; it.achieved=dKey(); if(S.mainId===id) S.mainId=(activeInts()[0]||{}).id||null; addJournal('achieve','Megvalósult szándék', it.wish); chime(); toast('Gratulálok! ✨ Ünnepeld meg!'); return closeSheet(); }
    case 'rest': { const it = S.intentions.find(i=>i.id===id); if(!it) return; it.status='pihen'; if(S.mainId===id) S.mainId=(activeInts()[0]||{}).id||null; save(); return closeSheet(); }
    case 'reactivate': { const it = S.intentions.find(i=>i.id===id); if(!it) return; if(activeInts().length>=3) return toast('Három aktív szándék a maximum. Pihentess egyet előbb.'); it.status='aktiv'; if(!S.mainId) S.mainId=id; save(); return render(); }
    case 'delInt': if(confirm('Biztosan törlöd ezt a szándékot?')){ S.intentions = S.intentions.filter(i=>i.id!==id); if(S.mainId===id) S.mainId=(activeInts()[0]||{}).id||null; save(); render(); } return;
    case 'skipWeek': S.profile.skipWeek = true; save(); return render();
    case 'restartWeek': S.profile.skipWeek = false; S.profile.start = dKey(); save(); return render();
  }
}

/* ---------- lélegzés-segéd: 4-4-6 (IBAR) ---------- */
function miniBreath(el, cycles, onDone){
  clearTimeout(window._bt); let c = 0, ph = 0;
  const seq = [['Belégzés',4],['Tartsd',4],['Kilégzés',6]];
  const tick = (left) => {
    const [lbl, len] = seq[ph];
    el.innerHTML = `<div class="mb"><b>${lbl}</b><span>${left}</span></div><div class="small" style="text-align:center">${c+1}. kör / ${cycles}</div>`;
    if(left > 1) { window._bt = setTimeout(()=>tick(left-1), 1000); return; }
    window._bt = setTimeout(() => { ph++; if(ph>2){ ph=0; c++; } if(c>=cycles){ el.innerHTML = '<div class="mb"><b>Kész</b><span>✓</span></div>'; chime(); onDone && onDone(); return; } tick(seq[ph][1]); }, 1000);
  };
  ac(); tick(seq[0][1]);
}

let onClose = null;

$('#shClose').addEventListener('click', closeSheet);
const autosize = el => { el.style.height='auto'; el.style.height = Math.min(el.scrollHeight+2, 320)+'px'; };
document.addEventListener('input', e => { if(e.target.matches && e.target.matches('textarea.auto')) autosize(e.target); });
new MutationObserver(() => $$('textarea.auto').forEach(t => { if(!t._as){ t._as=1; requestAnimationFrame(()=>autosize(t)); } })).observe(document.getElementById('shBody'), {childList:true, subtree:true});
$('#shBody').addEventListener('focusin', e => { if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type!=='hidden') setTimeout(() => { try{ e.target.scrollIntoView({block:'center', behavior:'smooth'}); }catch(x){} }, 320); });

function openBreath(min=3){
  sheet('Csend-légzés', `
    <p class="muted">Lélegezz a kör ritmusára: 5 másodperc be, 5 másodperc ki. Figyeld, hogyan lassul a tested, ahogy a levegő a szíved körül áramlik.</p>
    <div class="chips" id="bMin">${[1,3,5].map(n=>`<button class="chip ${n===min?'on':''}" data-m="${n}">${n} perc</button>`).join('')}</div>
    <div class="breath-wrap"><div class="breath" id="bCircle"><div class="ring"></div><div class="lbl" id="bLbl">Kész?</div></div></div>
    <div class="timer" id="bTime">${min}:00</div>
    <button class="btn block" id="bGo" style="margin-top:1rem">Indítás</button>
    <div class="note">Miért működik? A kb. percenkénti 6 légzés szinkronba hozza a szívritmust és a légzést (szívkoherencia). Ez az állapot a legjobb kiindulópont minden további gyakorlathoz.</div>`);
  let m = min;
  $$('#bMin .chip').forEach(c => c.addEventListener('click', () => { if(window._bi) return; m = +c.dataset.m; $$('#bMin .chip').forEach(x=>x.classList.toggle('on', x===c)); $('#bTime').textContent = m+':00'; }));
  $('#bGo').addEventListener('click', () => {
    if(window._bi){ clearInterval(window._bi); window._bi=null; DRONE.stop(); $('#bGo').textContent='Indítás'; $('#bLbl').textContent='Szünet'; $('#bCircle').classList.remove('in'); return; }
    ac(); DRONE.start(); let left = m*60, phase = 0; $('#bGo').textContent='Megállítás';
    const tick = () => {
      if(phase % 10 === 0){ $('#bCircle').classList.add('in'); $('#bLbl').textContent='Belégzés'; }
      if(phase % 10 === 5){ $('#bCircle').classList.remove('in'); $('#bLbl').textContent='Kilégzés'; }
      $('#bTime').textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
      phase++; left--;
      if(left < 0){ clearInterval(window._bi); window._bi=null; DRONE.stop(); chime(); mark('csend'); $('#bLbl').textContent='Csend'; $('#bCircle').classList.remove('in'); $('#bGo').textContent='Újra'; $('#bTime').textContent='Kész – a nyugalom veled marad.'; }
    };
    tick(); window._bi = setInterval(tick, 1000);
  });
}

/* ---------- Szándék-varázsló ---------- */
function openWizard(editId){
  const ex = editId ? S.intentions.find(i=>i.id===editId) : null;
  const W = ex ? JSON.parse(JSON.stringify(ex)) : {id:uid(), route:S.profile.route||'', wish:'', why:[], whyText:'', outcome:'', obstacle:'', ha:'', akkor:'', aff:'', level:2, sats:'', created:dKey(), status:'aktiv', signs:[]};
  let step = ex ? 1 : (W.route ? 1 : 0);
  const N = 7;
  const draw = () => {
    const r = ROUTES[W.route] || ROUTES.onertek, e = r.ex;
    const base = W.affBase || e.aff;
    let h = `<div class="prog" style="margin-bottom:1rem"><i style="width:${(step+1)/N*100}%"></i></div><div class="small">${step+1}. lépés / ${N}</div>`;
    if(step===0){
      h += `<h3>Melyik területen teremtesz?</h3><div class="route-grid">${Object.entries(ROUTES).map(([k,v])=>`<button class="route ${W.route===k?'on':''}" data-r="${k}"><div class="e">${v.e}</div><div class="n">${v.n}</div><div class="s">${v.s}</div></button>`).join('')}</div>`;
    } else if(step===1){
      h += `<h3>Mit szeretnél teremteni?</h3><p class="muted">Egy mondat, jelen időben, arról, amit szeretnél. Konkrét, és rajtad múló.</p><textarea id="wWish" placeholder="${esc(e.wish)}">${esc(W.wish)}</textarea>${negBox('wN1')}<button class="btn sm ghost" style="margin-top:.5rem" data-fill="wWish" data-v="${esc(e.wish)}">Példa betöltése</button>`;
    } else if(step===2){
      h += `<h3>Miért fontos ez neked?</h3><p class="muted">A belső okok (kapcsolódás, fejlődés, béke) tartósabb motivációt adnak, mint a külsők. Válassz egyet vagy többet.</p><div class="chips">${r.why.map(w=>`<button class="chip ${W.why.includes(w)?'on':''}" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div><label>Hogyan érzed magad, amikor ez megvalósul?</label><textarea id="wWhy" placeholder="pl. Nyugodt vagyok, könnyű a mellkasom, mosolygok.">${esc(W.whyText)}</textarea>`;
    } else if(step===3){
      h += `<h3>A legszebb pillanat</h3><p class="muted">Írd le azt az egy jelenetet, amikor a szándékod már valóság. Jelen időben, érzékszervekkel: mit látsz, hallasz, érzel? Ez lesz az Átélés középpontja.</p><textarea id="wOut" placeholder="${esc(e.outcome)}">${esc(W.outcome)}</textarea>${negBox('wN3')}`;
    } else if(step===4){
      h += `<h3>A belső akadály</h3><p class="muted">Most nézz befelé: mi az a <b>benned lévő</b> dolog – érzés, gondolat, szokás –, ami az utadba állhat? Ez a lépés teszi erőssé a szándékot: a kutatások szerint a vágy és az akadály együttes látása mozdít cselekvésre.</p><textarea id="wObs" placeholder="${esc(e.obstacle)}">${esc(W.obstacle)}</textarea>`;
    } else if(step===5){
      h += `<h3>A ha-akkor terved</h3><p class="muted">Egy előre eldöntött, konkrét lépés egy konkrét helyzethez. Ez az egyik legjobban kutatott eszköz a célok elérésére.</p><label>Ha…</label><input id="wHa" placeholder="${esc(e.ha)}" value="${esc(W.ha)}"><label>…akkor</label><input id="wAk" placeholder="${esc(e.akkor)}" value="${esc(W.akkor)}">${negBox('wN5')}<div class="note">Tipp: a „ha” lehet egy napi időpont, vagy maga a belső akadály („ha megjelenik a kétség…”). Az „akkor” legyen 2–20 perces, kézzelfogható lépés.</div>`;
    } else if(step===6){
      h += `<h3>Az affirmációd</h3><p class="muted">Írd le a végső mondatot, aztán válaszd ki azt a fokot, ami <b>most hihető</b> számodra. Bármikor feljebb léphetsz.</p><textarea id="wAff" class="auto" rows="2" placeholder="${esc(e.aff)}">${esc(W.affBase||'')}</textarea>${negBox('wN6')}<div id="wLad" style="margin-top:.8rem"></div>
      <label>Esti jelenet (nem kötelező)</label><p class="small" style="margin-top:0">Egy rövid pillanat, ami azt jelzi, hogy megtörtént – pl. valaki gratulál.</p><textarea id="wSats" class="auto" rows="2" placeholder="${esc(e.sats)}">${esc(W.sats)}</textarea>`;
    }
    h += `<div class="row" style="gap:.6rem;margin-top:1.3rem">${step>0?`<button class="btn ghost" id="wBack">Vissza</button>`:''}<button class="btn" style="flex:1" id="wNext">${step===N-1?'Mentés':'Tovább'}</button></div>`;
    $('#shBody').innerHTML = h;
    $$('#shBody [data-r]').forEach(b=>b.addEventListener('click',()=>{ W.route=b.dataset.r; draw(); }));
    $$('#shBody [data-w]').forEach(b=>b.addEventListener('click',()=>{ const w=b.dataset.w; W.why = W.why.includes(w)?W.why.filter(x=>x!==w):[...W.why,w]; b.classList.toggle('on'); }));
    $$('#shBody [data-fill]').forEach(b=>b.addEventListener('click',()=>{ $('#'+b.dataset.fill).value=b.dataset.v; $('#'+b.dataset.fill).dispatchEvent(new Event('input')); }));
    wireNeg('wWish','wN1'); wireNeg('wOut','wN3'); wireNeg('wAk','wN5'); wireNeg('wAff','wN6');
    if(step===6){ const lad = () => { const v = $('#wAff').value.trim() || base; $('#wLad').innerHTML = ladder(v).map((t,i)=>`<button class="tool" data-l="${i+1}" style="${W.level===i+1?'border-color:var(--gold);background:rgba(217,178,95,.14)':''}"><span class="ic">${i+1}</span><span><div class="t" style="font-weight:600">${esc(t)}</div></span></button>`).join(''); $$('#wLad [data-l]').forEach(b=>b.addEventListener('click',()=>{ W.level=+b.dataset.l; lad(); })); }; $('#wAff').addEventListener('input', lad); lad(); }
    const collect = () => {
      if(step===1) W.wish = $('#wWish').value.trim();
      if(step===2) W.whyText = $('#wWhy').value.trim();
      if(step===3) W.outcome = $('#wOut').value.trim();
      if(step===4) W.obstacle = $('#wObs').value.trim();
      if(step===5){ W.ha = $('#wHa').value.trim(); W.akkor = $('#wAk').value.trim(); }
      if(step===6){ W.affBase = $('#wAff').value.trim() || base; W.aff = ladder(W.affBase)[W.level-1]; W.sats = $('#wSats').value.trim(); }
    };
    $('#wBack') && $('#wBack').addEventListener('click',()=>{ collect(); step--; draw(); });
    $('#wNext').addEventListener('click',()=>{
      collect();
      if(step===0 && !W.route) return toast('Válassz egy területet.');
      if(step===1 && !W.wish) return toast('Írd le egy mondatban, mit szeretnél.');
      if(step===5 && (!W.ha || !W.akkor)) return toast('Töltsd ki mindkét mezőt – ez a legerősebb lépés.');
      if(step < N-1){ step++; return draw(); }
      if(!ex){
        if(activeInts().length >= 3){ W.status='pihen'; toast('Három aktív szándékod van, ez pihenőbe került.'); }
        S.intentions.unshift(W); if(!S.mainId && W.status==='aktiv') S.mainId = W.id;
        addJournal('intention','Új szándék', W.wish);
      } else { Object.assign(ex, W); save(); }
      mark('szandek'); save(); closeSheet(); go('szandek');
      toast('A szándékod rögzítve. 🌙');
    });
  };
  sheet(ex?'Szándék finomhangolása':'Szándék-varázsló','');
  draw();
}
function ladder(s){
  let t = String(s||'').trim().replace(/[.!]+$/,''); if(!t) t = 'jó dolgok érkeznek az életembe';
  const low = t.charAt(0).toLowerCase() + t.slice(1);
  return [`Nyitott vagyok arra a lehetőségre, hogy ${low}.`, `Engedem, hogy egyre inkább igaz legyen: ${low}.`, `Napról napra közelebb kerülök ehhez: ${low}.`, t.charAt(0).toUpperCase()+t.slice(1)+'.'];
}
function openLadder(id){
  const it = id ? S.intentions.find(i=>i.id===id) : mainInt();
  sheet('Affirmáció-létra', `<p class="muted">A kutatás szerint a túl nagy ugrású mondat – ha a belső hang ellentmond – akár ronthatja is a hangulatot. A létra fokozatosan visz feljebb. Mindig azt a fokot mondd, ami <b>most hihető</b>.</p>
  <label>A végső mondatod</label><textarea id="lAff" class="auto" rows="2" placeholder="pl. Értékes vagyok, úgy, ahogy vagyok.">${esc(it ? (it.affBase||it.aff||'') : '')}</textarea>${negBox('lN')}
  <div id="lList" style="margin-top:.8rem"></div>
  ${it?`<button class="btn block" id="lSave" style="margin-top:.6rem">A kiválasztott fok mentése</button>`:''}
  <div class="note">Gyakorlat: mondd ki a választott mondatot háromszor, lassan, és figyeld, hol érzed a testedben. Ha a belső hang ellenkezik, lépj egy fokkal lejjebb – ez is haladás.</div>`);
  let lvl = it ? (it.level||2) : 2;
  const draw = () => { $('#lList').innerHTML = ladder($('#lAff').value).map((t,i)=>`<button class="tool" data-l="${i+1}" style="${lvl===i+1?'border-color:var(--gold);background:rgba(217,178,95,.14)':''}"><span class="ic">${i+1}</span><span><div class="t" style="font-weight:600">${esc(t)}</div></span></button>`).join(''); $$('#lList [data-l]').forEach(b=>b.addEventListener('click',()=>{ lvl=+b.dataset.l; draw(); speakOne(ladder($('#lAff').value)[lvl-1]); })); };
  $('#lAff').addEventListener('input', draw); wireNeg('lAff','lN'); draw();
  $('#lSave') && $('#lSave').addEventListener('click',()=>{ it.affBase = $('#lAff').value.trim(); it.level = lvl; it.aff = ladder(it.affBase)[lvl-1]; save(); toast('Mentve.'); closeSheet(); });
}
function speakOne(t){ if(TTS.has()) TTS.run([{t, p:0}]); }

/* ---------- Vezetett átélés ---------- */
function visualScript(it){
  const r = ROUTES[it ? it.route : 'onertek'] || ROUTES.onertek;
  const out = it && it.outcome ? it.outcome : r.ex.outcome;
  const step = it && it.akkor ? it.akkor : r.ex.akkor;
  const aff = it && it.aff ? it.aff : r.ex.aff;
  const feel = it && it.whyText ? it.whyText : '';
  return [
    {t:'Helyezkedj el kényelmesen. Engedd, hogy a figyelmed megérkezzen a lélegzetedbe.', p:4},
    {t:'Belégzés… lassan, öt másodpercig. És kilégzés… lassan, öt másodpercig.', p:9},
    {t:'Figyeld, ahogy a levegő a szíved környékén áramlik be és ki. Mintha a szíveden keresztül lélegeznél.', p:10},
    {t:'Idézz fel egy pillanatot, amikor hálát éreztél. Egy embert, egy helyet, egy apró ajándékot. Engedd, hogy ez az érzés kitöltse a mellkasodat.', p:12},
    {t:'Most a figyelmed az útra vándorol. Látod magad, ahogy megteszed a következő lépést: ' + step + '.', p:6},
    {t:r.ut, p:8},
    {t:'Figyeld meg: hol vagy? Milyen a fény? Mit hallasz? Milyen a testtartásod, ahogy cselekszel?', p:10},
    {t:'Most lépj előre az időben, abba a pillanatba, amikor a szándékod már valóság.', p:5},
    {t:out, p:8},
    {t:r.veg, p:10},
    {t:'Ez most történik. Belülről éled. Mit látsz magad előtt? Milyen hangokat hallasz? Mit érzel a testedben?', p:12},
    ...(feel ? [{t:'Érezd: ' + feel, p:9}] : []),
    {t:'Mondd el magadban, lassan: ' + aff, p:7},
    {t:'Engedd, hogy ez az érzés a sejtjeidig áradjon. Ez az érzés a tiéd, és veled marad.', p:8},
    {t:'Most érezd a talpadat. Érezd a súlyodat azon, amin ülsz vagy fekszel. Mozdítsd meg finoman az ujjaidat.', p:6},
    {t:'Visszaérkezel a jelenbe, és magaddal hozod ezt a nyugalmat, ezt a bizonyosságot. Készen állsz a mai lépésedre.', p:2}
  ];
}
function openVisual(id){
  const it = id ? S.intentions.find(i=>i.id===id) : mainInt();
  const segs = visualScript(it);
  sheet('Vezetett átélés', `
    ${it?`<p class="small">Szándék: <b class="gold">${esc(it.wish)}</b></p>`:`<div class="note">Még nincs szándékod, ezért egy példaszöveget hallasz. A Szándék-varázsló után a saját mondataiddal szól.</div>`}
    <div class="narr"><p id="vTxt">Kb. ${Math.round(segs.reduce((a,s)=>a+s.p+s.t.length*0.075,0)/60)} perc. Ülj vagy feküdj kényelmesen. Amikor készen állsz, indítsd el.</p></div>
    <div class="prog"><i id="vProg" style="width:0%"></i></div>
    <div class="row" style="gap:.6rem;margin-top:1rem"><button class="btn" style="flex:1" id="vGo">Indítás</button></div>
    <p class="small" style="margin-top:.8rem">${TTS.has()?'A szöveget a telefon magyar hangja olvassa fel. Hangerő és tempó a Beállításokban.':'Felolvasás kikapcsolva – a szöveg lépésenként jelenik meg.'}</p>
    <div class="note">A kutatás szerint az a képzelet a leghatékonyabb, amely az utat és a célt is tartalmazza, és belülről, érzékszervekkel élhető át.</div>`);
  let running = false;
  $('#vGo').addEventListener('click', () => {
    if(running){ TTS.stop(); DRONE.stop(); running=false; $('#vGo').textContent='Újraindítás'; return; }
    running = true; ac(); DRONE.start(); $('#vGo').textContent='Megállítás';
    TTS.run(segs, (i,s)=>{ $('#vTxt').textContent = s.t; $('#vProg').style.width = ((i+1)/segs.length*100)+'%'; }, ()=>{ running=false; DRONE.stop(); chime(); mark('atel'); $('#vTxt').textContent='Szép munka. Vidd magaddal ezt az érzést a napodba.'; $('#vGo').textContent='Újra'; });
  });
}

      {t:'A homlokod ellazul. A vállad ellazul. A kezed ellazul. A lábad ellazul.',p:10},
      {t:'Most idézd fel a jelenetedet. Ez most történik.',p:3},
      {t:sc,p:9},{t:'Éld át újra. Érezd, ahogy megtörténik.',p:3},{t:sc,p:9},

      {t:'Ismételd magadban újra és újra, amíg valóságosnak érzed.',p:20},
      {t:'Engedd, hogy ez az érzés átvezessen az álomba. Minden rendben van. Jó éjszakát.',p:2}

function open55(){

  const M = S.m55;

    const k = dKey(), n = M.days[k]||0;

    $('#shBody').innerHTML = `<p class="muted">Egy mondat, naponta 55-ször leírva vagy kimondva, 5 napon át. Rövid, intenzív fókusz-kihívás.</p>

    <button class="btn block" id="m5P" ${n>=55?'disabled':''}>Leírtam / kimondtam (+1)</button>
    <button class="btn block ghost" id="m5R" style="margin-top:.6rem">Kihívás újrakezdése mától</button>`;
    wireNeg('m5T','m5N');
    $('#m5T').addEventListener('change',e=>{ M.text=e.target.value.trim(); save(); });

    let kind='cel';
    $$('[data-k]').forEach(b=>b.addEventListener('click',()=>{ kind=b.dataset.k; $('#vbF').click(); }));
    $('#vbF').addEventListener('change', async e=>{ const f=e.target.files[0]; if(!f) return; const img = await shrink(f, 700); const text = ($('#vbCap') && $('#vbCap').value.trim()) || ''; S.vision.push({id:uid(), kind, img, text}); if(save()) draw(); else S.vision.pop(); });
    $$('[data-x]').forEach(b=>b.addEventListener('click',()=>{ S.vision=S.vision.filter(v=>v.id!==b.dataset.x); save(); draw(); }));
  };
  sheet('Vision board',''); draw();
}
function shrink(file, max){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.72)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

      addJournal('kerdesut','Kérdés-út', txt); mark('szandek'); if(J.thanks){ const d=day(); d.hala=[...(d.hala||[]), J.thanks]; d.steps.hala=true; save(); }
      chime(); toast('A Kérdés-út elmentve a naplódba. 🗝️'); closeSheet();
    });
  };
  sheet('Kérdés-út',''); draw();
}

    },1000);
  });
}

const ROUTE_AFF = {penz:'bovseg', szerelem:'szerelem', hivatas:'hivatas', egeszseg:'egeszseg', onertek:'onszeretet', otthon:'otthon'};
const affAll = () => Object.entries(AFF).flatMap(([k,t]) => t.l.map(x => ({k, t:x})));
function affFavs(){ return S.affFav || (S.affFav = []); }
function affOwn(){ return S.affOwn || (S.affOwn = []); }
function dailyAff(){
  const all = affAll(), favs = affFavs(); const k = dKey(); let h = 0; for(const c of k) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const route = ROUTE_AFF[(mainInt()||{}).route || S.profile.route];
  const pool = favs.length && h % 3 === 0 ? favs.map(t=>({k:'fav',t})) : (route && h % 2 === 0 ? AFF[route].l.map(t=>({k:route,t})) : all);
  return pool[h % pool.length];
}
function affListFor(theme){
  if(theme === 'fav') return affFavs().slice();
  if(theme === 'own') return affOwn().slice();
  return (AFF[theme] || AFF.bovseg).l.slice();
}

const PLAY = { on:false, stop(){ this.on=false; TTS.stop(); DRONE.stop(); $$('.aff.playing').forEach(x=>x.classList.remove('playing')); const b=$('#afPlay'); if(b) b.innerHTML='▶ Lejátszás'; } };
function playList(list, opts={}){

}

/* =========================================================
   SAJÁT HANGOM – felvétel (MediaRecorder) + tárolás (IndexedDB)
   ========================================================= */
const ADB = {
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('nincs IndexedDB')); const r=indexedDB.open('th_audio',1); r.onupgradeneeded=()=>r.result.createObjectStore('recs',{keyPath:'id'}); r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); },
  async all(){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('recs').objectStore('recs').getAll(); q.onsuccess=()=>res((q.result||[]).sort((a,b)=>b.created-a.created)); q.onerror=()=>rej(q.error); }); },
  async put(o){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('recs','readwrite'); t.objectStore('recs').put(o); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async del(id){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('recs','readwrite'); t.objectStore('recs').delete(id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
};
const REC = { mr:null, stream:null, chunks:[], t0:0, timer:null, audio:null, url:null };
function recMime(){ const c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg;codecs=opus']; if(!window.MediaRecorder) return ''; return c.find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } }) || ''; }
function stopAudio(){ if(REC.audio){ REC.audio.pause(); REC.audio=null; } if(REC.url){ URL.revokeObjectURL(REC.url); REC.url=null; } }
function stopRec(){ clearInterval(REC.timer); try{ if(REC.mr && REC.mr.state!=='inactive') REC.mr.stop(); }catch(e){} if(REC.stream){ REC.stream.getTracks().forEach(t=>t.stop()); REC.stream=null; } }
const fmtDur = s => `${Math.floor(s/60)}:${pad(Math.round(s%60))}`;

function openRecorder(list, theme){
  const it = mainInt();
  let texts = (list && list.length) ? list.slice() : [ (it && it.aff) || 'Értékes vagyok, úgy, ahogy vagyok.' ];
  let idx = 0, blob = null, dur = 0, src = theme ? (theme==='fav'?'Kedvenceim':theme==='own'?'Sajátjaim':(AFF[theme]||{}).n) : 'Saját szöveg';
  const can = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const draw = () => {
    $('#shBody').innerHTML = `
      ${can ? '' : `<div class="note warn">Ez a böngésző a hangfelvételt nem támogatja. Nyisd meg az appot Chrome-ban (Android) vagy Safariban (iPhone), a webcímről – a letöltött fájlból a felvétel nem indul.</div>`}
      <p class="muted">Olvasd fel a mondatokat a saját hangodon, lassan, érzéssel. Sokan úgy érzik, a saját hangjuk hat rájuk a legmélyebben – ezt hallják a legtöbbször, és ennek hisznek a leginkább.</p>
      <div class="card gold prompter"><div class="small">${esc(src)} · ${idx+1} / ${texts.length}</div><p class="quote" id="rcTxt">${esc(texts[idx]||'')}</p>
        <div class="row" style="gap:.5rem;justify-content:center"><button class="btn sm ghost" id="rcPrev" ${idx===0?'disabled':''}>‹ Előző</button><button class="btn sm soft" id="rcNext" ${idx>=texts.length-1?'disabled':''}>Következő ›</button></div></div>
      <details style="margin:.2rem 0 1rem"><summary>Saját szöveget olvasnék fel</summary><textarea id="rcOwn" class="auto" rows="3" placeholder="Írd vagy másold be – minden sor egy mondat." style="margin-top:.6rem"></textarea>${negBox('rcN')}<button class="btn sm ghost" id="rcUse" style="margin-top:.5rem">Ezt olvasom fel</button></details>
      <div style="display:grid;place-items:center;gap:.6rem">
        <button class="recbtn ${REC.mr&&REC.mr.state==='recording'?'on':''}" id="rcBtn" ${can?'':'disabled'} aria-label="Felvétel"><span></span></button>
        <div class="timer" id="rcTime">${REC.mr&&REC.mr.state==='recording'?'Felvétel…':blob?'Kész: '+fmtDur(dur):'Koppints a felvétel indításához'}</div>
      </div>
      ${blob?`<div class="card" style="margin-top:1rem"><label style="margin-top:0">A felvétel neve</label><input id="rcName" value="${esc(src)} – ${fmtShort(dKey())}"><div class="row" style="gap:.5rem;margin-top:.7rem"><button class="btn sm ghost" id="rcHear">▶ Meghallgatom</button><button class="btn sm" id="rcSave" style="flex:1">Mentés</button></div><button class="btn sm ghost block" id="rcAgain" style="margin-top:.5rem">Újra veszem</button></div>`:''}
      <div class="note">Tipp: mondatok között tarts 2–3 másodperc szünetet. Próbáld ki tegező formában is („${esc((S.profile.name||'Anna'))}, te értékes vagy”) – sokaknak így könnyebb elfogadni a mondatot.</div>
      <div class="sec-title">Saját felvételeim</div><div id="rcList"><div class="empty">Betöltés…</div></div>`;
    $('#rcPrev').addEventListener('click',()=>{ if(idx>0){ idx--; $('#rcTxt').textContent=texts[idx]; draw(); } });
    $('#rcNext').addEventListener('click',()=>{ if(idx<texts.length-1){ idx++; draw(); } });
    wireNeg('rcOwn','rcN');
    $('#rcUse').addEventListener('click',()=>{ const v=$('#rcOwn').value.split('\n').map(x=>x.trim()).filter(Boolean); if(!v.length) return toast('Írj be legalább egy mondatot.'); texts=v; idx=0; src='Saját szöveg'; draw(); });
    $('#rcBtn').addEventListener('click', async ()=>{
      if(REC.mr && REC.mr.state==='recording'){ stopRec(); return; }
      stopAudio();
      try{
        REC.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
        const mime = recMime(); REC.chunks=[]; REC.mr = mime ? new MediaRecorder(REC.stream,{mimeType:mime}) : new MediaRecorder(REC.stream);
        REC.mr.ondataavailable = e => { if(e.data && e.data.size) REC.chunks.push(e.data); };
        REC.mr.onstop = () => { dur=(Date.now()-REC.t0)/1000; blob=new Blob(REC.chunks,{type:REC.mr.mimeType||mime||'audio/webm'}); REC.mr=null; draw(); };
        REC.mr.start(); REC.t0=Date.now(); $('#rcBtn').classList.add('on');
        REC.timer=setInterval(()=>{ const t=$('#rcTime'); if(t) t.textContent='● Felvétel… '+fmtDur((Date.now()-REC.t0)/1000)+' – koppints a leállításhoz'; },500);
      }catch(e){ stopRec(); toast(/denied|NotAllowed/i.test(e.name+e.message)?'A mikrofon engedélyezése szükséges – a böngésző beállításaiban engedélyezd.':'A felvétel nem indult el: '+(e.message||e.name)); }
    });
    if(blob){
      $('#rcHear').addEventListener('click',()=>{ stopAudio(); REC.url=URL.createObjectURL(blob); REC.audio=new Audio(REC.url); REC.audio.play().catch(()=>toast('A lejátszás nem indult el.')); });
      $('#rcAgain').addEventListener('click',()=>{ stopAudio(); blob=null; draw(); });
      $('#rcSave').addEventListener('click', async ()=>{ try{ await ADB.put({id:uid(), name:$('#rcName').value.trim()||src, created:Date.now(), dur, mime:blob.type, blob, texts}); stopAudio(); blob=null; toast('Felvétel elmentve 🎙️'); addJournal('note','Saját hangfelvétel', texts.slice(0,3).join('\n')); draw(); }catch(e){ toast('A mentés nem sikerült: '+(e.message||e)); } });
    }
    renderRecList();
  };
  sheet('Saját hangom',''); onClose = () => { stopRec(); stopAudio(); }; draw();
}
async function renderRecList(){
  const box = $('#rcList'); if(!box) return;
  let recs = []; try{ recs = await ADB.all(); }catch(e){ box.innerHTML = '<div class="empty">A felvételek tárolása ebben a böngészőben nem érhető el.</div>'; return; }
  if(!$('#rcList')) return;
  if(!recs.length){ box.innerHTML = '<div class="empty">Az első felvételed itt jelenik meg.</div>'; return; }
  box.innerHTML = recs.map(r=>`<div class="card recrow" style="padding:.85rem 1rem"><div class="row between"><b>${esc(r.name)}</b><span class="small">${fmtDur(r.dur||0)}</span></div><div class="small">${new Date(r.created).toLocaleDateString('hu-HU')}</div>
    <div class="acts"><button class="act" data-rp="${r.id}">▶ Lejátszás</button><button class="act" data-rl="${r.id}">🔁 Ismétlés</button><button class="act" data-rd="${r.id}">⬇️ Letöltés</button><button class="act" data-rx="${r.id}">🗑️</button></div></div>`).join('');
  const get = id => recs.find(r=>r.id===id);
  const play = (id, loop, btn) => { const was = REC.audio && REC.audio._id===id && REC.audio._loop===loop; stopAudio(); $$('#rcList .act.on').forEach(x=>{ x.classList.remove('on'); }); if(was) return; const r=get(id); REC.url=URL.createObjectURL(r.blob); REC.audio=new Audio(REC.url); REC.audio._id=id; REC.audio._loop=loop; REC.audio.loop=loop; btn.classList.add('on'); REC.audio.onended=()=>btn.classList.remove('on'); REC.audio.play().then(()=>mark('szandek')).catch(()=>toast('A lejátszás nem indult el.')); };
  $$('#rcList [data-rp]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.rp,false,b)));
  $$('#rcList [data-rl]').forEach(b=>b.addEventListener('click',()=>play(b.dataset.rl,true,b)));
  $$('#rcList [data-rd]').forEach(b=>b.addEventListener('click',()=>{ const r=get(b.dataset.rd); const ext=/mp4|aac/.test(r.mime)?'m4a':/ogg/.test(r.mime)?'ogg':'webm'; const a=document.createElement('a'); a.href=URL.createObjectURL(r.blob); a.download=`${r.name.replace(/[^\p{L}\p{N} _-]/gu,'').trim()||'felvetel'}.${ext}`; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),500); }));
  $$('#rcList [data-rx]').forEach(b=>b.addEventListener('click',async()=>{ if(!confirm('Törlöd ezt a felvételt?')) return; stopAudio(); await ADB.del(b.dataset.rx); renderRecList(); }));
}

function onboarding(){
  const ob = $('#onboard'); ob.classList.remove('hide'); $('#app').style.display='none'; $('#tabs').classList.add('hide');
  let st = 0, name = S.profile.name, route = '';
  const draw = () => {
    let h = `<div class="ob"><div style="display:grid;place-items:center;margin:.6rem 0 1rem">${moonSVG(moon().age, 110)}</div>`;
    if(st===0) h += `<h1 style="text-align:center">Teremtő Hold</h1><p class="muted" style="text-align:center">Manifesztáció a csendből, a szándékon át a lépésig – a hold ritmusában.</p>
      <div class="card gold"><h3>Így működik</h3><div class="steps">${[['Csend','Lecsendesíted az idegrendszered'],['Szándék','Megfogalmazod, mit teremtesz és miért'],['Átélés','Belülről éled át az utat és a célt'],['Lépés','Megteszed a mai kis lépést'],['Hála','Este hálát adsz és figyeled a jeleket']].map((x,i)=>`<div class="row"><div class="step" style="padding:.2rem;border:0;background:none"><div class="n">${i+1}</div></div><div><b>${x[0]}</b><div class="small">${x[1]}</div></div></div>`).join('')}</div></div>
      <button class="btn block" id="obN">Kezdjük</button>`;
    else if(st===1) h += `<h2>Hogyan szólíthatlak?</h2><input id="obName" value="${esc(name)}" placeholder="Keresztneved"><button class="btn block" id="obN" style="margin-top:1rem">Tovább</button>`;
    else if(st===2) h += `<h2>Melyik terület hív most a legjobban?</h2><p class="muted">Később bármikor bővítheted.</p><div class="route-grid">${Object.entries(ROUTES).map(([k,v])=>`<button class="route ${route===k?'on':''}" data-r="${k}"><div class="e">${v.e}</div><div class="n">${v.n}</div><div class="s">${v.s}</div></button>`).join('')}</div><button class="btn block" id="obN" style="margin-top:1rem">Tovább</button>`;
    else h += `<h2>Mielőtt elindulsz</h2>
      <div class="card"><p>A Teremtő Hold a szellemi hagyományt (Joe Dispenza, Neville Goddard) és a pszichológiai kutatásokat ötvözi.</p>
      <p>A gondolat irányt ad, a cselekvés visz előre – ezért minden szándékhoz tartozik egy konkrét lépés is.</p>
      <p class="small">Az app önismereti eszköz. Egészségügyi, pénzügyi vagy lelki nehézségben mindig érdemes szakember támogatását is kérni – ez is az önszeretet része.</p></div>
      <div class="card gold"><h3>Az első heted</h3><p class="small">7 napon át minden nap egy új eszközzel ismerkedsz meg, napi 10 percben. Utána a holdciklus-program vezet tovább.</p></div>
      <button class="btn block" id="obN">Indulás 🌙</button>`;
    h += `</div>`; ob.innerHTML = h;
    $$('#onboard [data-r]').forEach(b=>b.addEventListener('click',()=>{ route=b.dataset.r; draw(); }));
    $('#obN').addEventListener('click',()=>{
      if(st===1){ name=$('#obName').value.trim(); }
      if(st===2 && !route) return toast('Válassz egy területet.');
      if(st<3){ st++; return draw(); }
      Object.assign(S.profile,{name, route, onboarded:true, start:dKey()}); save();
      ob.classList.add('hide'); showApp(); setTimeout(()=>openWizard(),400);
    });
  };
  draw();
}

/* ---------- Zárolás ---------- */
function sha256js(str){
  const bytes = new TextEncoder().encode(str), K = [], H = [1779033703,-1150833019,1013904242,-1521486534,1359893119,-1694144372,528734635,1541459225];
  let n = 2; for(let c=0;c<64;n++){ let p=true; for(let d=2;d*d<=n;d++) if(n%d===0){p=false;break;} if(p) K[c++] = (Math.pow(n,1/3)%1)*4294967296|0; }
  const l = bytes.length, words = new Array(((l+9+63)>>6)<<4).fill(0);
  for(let i=0;i<l;i++) words[i>>2] |= bytes[i] << (24-(i%4)*8);
  words[l>>2] |= 0x80 << (24-(l%4)*8); words[words.length-1] = l*8;
  const r = (x,y) => (x>>>y)|(x<<(32-y));
  for(let j=0;j<words.length;j+=16){
    const w = words.slice(j,j+16); let [a,b,c,d,e,f,g,h] = H;
    for(let i=0;i<64;i++){
      if(i>=16){ const x=w[i-15], y=w[i-2]; w[i] = (w[i-16] + (r(x,7)^r(x,18)^(x>>>3)) + w[i-7] + (r(y,17)^r(y,19)^(y>>>10)))|0; }
      const t1 = (h + (r(e,6)^r(e,11)^r(e,25)) + ((e&f)^(~e&g)) + K[i] + w[i])|0, t2 = ((r(a,2)^r(a,13)^r(a,22)) + ((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function sha(s){
  try{ if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  return sha256js(s);
}
const norm = (n,c) => `${n.normalize('NFC').trim().toLowerCase().replace(/\s+/g,' ')}::${c.normalize('NFC').replace(/\s+/g,'').toUpperCase()}::${CONFIG.SALT}`;
async function checkLock(){
  if(!CONFIG.LOCK_ENABLED) return true;
  const t = LS.get('th_token');
  return !!(t && CONFIG.BH_VALID_HASHES.includes(t));
}
function showLock(){
  $('#lock').style.display='grid'; $('#lockMoon').innerHTML = moonSVG(moon().age, 96);
  const go2 = async () => {
    const n=$('#lkName').value, c=$('#lkCode').value; if(!n.trim()||!c.trim()){ $('#lkErr').textContent='Add meg a keresztneved és a kódot.'; return; }
    try{ const h = await sha(norm(n,c)); if(CONFIG.BH_VALID_HASHES.includes(h)){ LS.set('th_token', h); if(!S.profile.name){ S.profile.name = n.trim(); save(); } $('#lock').style.display='none'; boot(true); } else { $('#lkErr').textContent='A név vagy a kód eltér attól, amit kaptál. Ellenőrizd a betűket (a kis- és nagybetű mindegy).'; } }
    catch(e){ $('#lkErr').textContent='Hiba történt a belépésnél: ' + (e && e.message || e); }
  };
  $('#lkBtn').onclick = go2; $('#lkCode').onkeydown = e => { if(e.key==='Enter') go2(); };
}

/* ---------- Hash-generátor (admin): index.html?hashgen ---------- */
function hashGen(){
  document.body.innerHTML = `<div class="ob"><h2>Kód-generátor</h2><p class="small">Csak adminnak. Az eredményt a CONFIG.BH_VALID_HASHES listába kell tenni.</p><label>Keresztnév</label><input id="hgN"><label>Kód</label><input id="hgC"><button class="btn block" id="hgB" style="margin-top:1rem">Hash készítése</button><textarea id="hgO" style="margin-top:1rem" readonly></textarea></div>`;
  $('#hgB').onclick = async () => { $('#hgO').value = `'${await sha(norm($('#hgN').value, $('#hgC').value))}',`; };
}

/* ---------- indítás ---------- */
function showApp(){ $('#app').style.display='block'; $('#tabs').classList.remove('hide'); render(); }
async function boot(unlocked){
  applyFs(S.settings.fs); TTS.init();
  if(!unlocked && !(await checkLock())){ showLock(); return; }
  if(!S.profile.onboarded) return onboarding();
  showApp();
}
$$('#tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
document.addEventListener('visibilitychange', () => { if(!document.hidden && $('#app').style.display==='block' && !$('#sheet').classList.contains('open')) render(); });
if(location.search.includes('hashgen')) hashGen(); else boot();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
